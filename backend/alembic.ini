# ───────────────────────────────────────────────────────────────
#  Configuração do Alembic — versionador de schema do Postgres
# ───────────────────────────────────────────────────────────────
# Como usar (sempre do diretório backend/):
#
#   alembic upgrade head                        # aplica migrations
#   alembic revision --autogenerate -m "nome"   # gera migration nova
#   alembic downgrade -1                        # rollback 1 passo
#   alembic current                             # vê versão atual
#   alembic history                             # vê histórico
#
# A `sqlalchemy.url` aqui é IGNORADA — a gente sobrescreve em
# `alembic/env.py` pra usar a URL do .env (única fonte de verdade).

[alembic]
# Onde ficam os scripts de migration
script_location = alembic

# Template do nome dos arquivos: timestamp_nome.py
# Mantém ordem cronológica visível
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Timezone das migrations (UTC é o padrão sano)
timezone = UTC

# URL placeholder — sobrescrita em env.py
sqlalchemy.url = postgresql://localhost/reative

[post_write_hooks]
# Não usar formatador automático — evita conflitos com black/ruff
# se você adicionar depois

# ─── Logging do Alembic ────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S