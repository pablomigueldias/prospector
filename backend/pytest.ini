[pytest]
# Runner único da suíte. Os smokes históricos (tests/test_*.py, cada um com
# main()) NÃO são coletados diretamente — quem os roda como casos é o
# test_smoke_suite.py (importa cada módulo e chama o main()). Isso evita que a
# coleção do pytate importe os 60 arquivos (alguns com efeito colateral) e
# mantém os smokes como fonte da verdade. Ver docs/ORGANIZACAO_REFATORACAO.md.
testpaths = tests
python_files = test_smoke_suite.py
addopts = -q -p no:cacheprovider
