# ────────────────────────────────────────────────────────────────
#  Reative Systems — infraestrutura local de desenvolvimento
# ────────────────────────────────────────────────────────────────
# Sobe Postgres 16 + pgvector pra todo o ecossistema da Reative.
#
# Como usar:
#   docker compose up -d         # sobe em background
#   docker compose ps            # vê status
#   docker compose logs -f db    # vê logs do banco em tempo real
#   docker compose down          # para (mantém dados)
#   docker compose down -v       # para e APAGA dados
#
#   postgresql+asyncpg://reative:reative_dev@localhost:5433/reative

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: reative-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: reative
      POSTGRES_PASSWORD: reative_dev
      POSTGRES_DB: reative
      LANG: pt_BR.UTF-8
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C.UTF-8"
    ports:
      - "5433:5432"
    volumes:
      - reative_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reative -d reative"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  reative_db_data:
    name: reative_db_data