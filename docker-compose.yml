# ────────────────────────────────────────────────────────────────
#  Reative Systems — infraestrutura local de desenvolvimento
# ────────────────────────────────────────────────────────────────
# Sobe Postgres 16 + pgvector pra todo o ecossistema da Reative.
#
# Como usar:
#   docker compose up -d         # sobe em background
#   docker compose ps            # vê status
#   docker compose logs -f db    # vê logs do banco em tempo real
#   docker compose down          # para (mantém dados)
#   docker compose down -v       # para e APAGA dados
#
#   postgresql+asyncpg://reative:reative_dev@localhost:5433/reative

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: reative-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: reative
      POSTGRES_PASSWORD: reative_dev
      POSTGRES_DB: reative
      LANG: pt_BR.UTF-8
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C.UTF-8"
    ports:
      - "5433:5432"
    volumes:
      - reative_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reative -d reative"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO (S3 self-hosted) — storage de comprovantes/boletos/notas.
  # Console em http://localhost:9001 (login minioadmin/minioadmin).
  # API S3 em http://localhost:9000 (é o que a API usa via S3_ENDPOINT).
  minio:
    image: minio/minio:latest
    container_name: reative-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - reative_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  reative_db_data:
    name: reative_db_data
  reative_minio_data:
    name: reative_minio_data